# Pipeline de CI: corre en cada PR y en cada push a main.
# Etapa 1 del pipeline de la letra: build + detección de secretos.
# Se irán agregando etapas: Trivy, Semgrep, Sonar, publish, deploy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Detección de secretos: falla si encuentra credenciales en el repo o el historial
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build de las 6 imágenes en paralelo (matriz)
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app/src/${{ matrix.service }}
          push: false
          tags: tero/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max