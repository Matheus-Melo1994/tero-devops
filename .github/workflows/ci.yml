# Pipeline de CI: corre en cada PR y en cada push a main.
# Etapas: secretos (Gitleaks) → SCA (Trivy fs) → build + escaneo de imagen (Trivy image)
# Próximas: Semgrep (SAST), SonarCloud (calidad), publicación en GHCR, deploy.
 
name: CI
 
on:
  pull_request:
  push:
    branches: [main]
 
jobs:
  # 5.4 Detección de secretos: falla si encuentra credenciales en el repo o el historial
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
  # 5.1 SCA: escanea dependencias (go.sum, package.json, requirements.txt).
  # Quality gate de la letra: bloquea CRITICAL/HIGH que tengan parche disponible.
  sca:
    name: Dependencias (Trivy fs)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: app/src
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table
 
  # Build de las 6 imágenes en paralelo + 5.2 escaneo de cada imagen antes de publicar
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: sca
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app/src/${{ matrix.service }}
          push: false
          load: true
          tags: tero/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de imagen (Trivy image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: tero/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table