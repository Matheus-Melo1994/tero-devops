# Pipeline de CI: corre en cada PR y en cada push a main.
# Etapas: secretos → SAST → SCA → build + escaneo de imagen → publicar en GHCR.
# Las pruebas de integración también deben aprobarse antes de publicar.
# Próximas: SonarCloud (calidad), gates bloqueantes de Trivy, deploy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 5.4 Detección de secretos: falla si encuentra credenciales en el repo o el historial
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # 5.3 SAST: análisis estático de seguridad del código (Go, TS, Python).
  # Reglas: p/default + OWASP top 10. Falla si encuentra hallazgos de severidad ERROR.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: gitleaks
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error app/src

  # TEMPORAL: gate informativo (exit-code 0) hasta remediar los hallazgos del primer
  # escaneo (catalog 29, orders 22, checkout 82). Volver a exit-code 1 al remediar.
  # 5.1 SCA: escanea dependencias (go.sum, package.json, requirements.txt).
  # Quality gate de la letra: bloquea CRITICAL/HIGH que tengan parche disponible.
  sca:
    name: Dependencias (Trivy fs)
    runs-on: ubuntu-latest
    needs: [gitleaks, sast]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/src
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table

  # Build de las 6 imágenes en paralelo + 5.2 escaneo de cada imagen antes de publicar
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: sca
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app/src/${{ matrix.service }}
          push: false
          load: true
          tags: tero/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de imagen (Trivy image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tero/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: tero-integration
      COMPOSE_FILE: app/docker-compose.yml:app/tests/integration/compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Preparar credenciales efímeras
        shell: bash
        run: |
          umask 077
          {
            echo 'POSTGRES_USER=retail_user'
            echo 'ADMIN_USERNAME=admin'
          } > "$RUNNER_TEMP/tero-ci.env"
          for key in POSTGRES_PASSWORD ADMIN_PASSWORD ADMIN_JWT_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$RUNNER_TEMP/tero-ci.env"
          done
      - name: Ejecutar las dos pruebas sobre Tero
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" up \
            --build --abort-on-container-exit --exit-code-from integration-tests \
            --attach integration-tests integration-tests
      - name: Recoger resultados y logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tero-test-results"
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" logs \
            --no-color --no-log-prefix integration-tests > "$RUNNER_TEMP/tero-test-results/integration.tap"
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" logs \
            --no-color --timestamps > "$RUNNER_TEMP/tero-test-results/compose.log"
          # Los valores generados son hexadecimales; también se ocultan en los archivos.
          while IFS='=' read -r key value; do
            case "$key" in
              *_PASSWORD|*_SECRET)
                sed -i "s/$value/[REDACTED]/g" "$RUNNER_TEMP/tero-test-results/"* ;;
            esac
          done < "$RUNNER_TEMP/tero-ci.env"
      - name: Guardar evidencia de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ${{ runner.temp }}/tero-test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Retirar el entorno temporal
        if: always()
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" down --volumes --remove-orphans
          rm -f "$RUNNER_TEMP/tero-ci.env"

  # 3.2 Publicar en registry: solo en push a main (no en PRs).
  # Las imágenes quedan en ghcr.io/matheus-melo1994/tero-<servicio>:<sha> y :latest
  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: app/src/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/matheus-melo1994/tero-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/matheus-melo1994/tero-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
