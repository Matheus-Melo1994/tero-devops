# Pipeline de CI: corre en cada PR y en cada push a main.
# Etapas: secretos → SAST + calidad + SCA → build + escaneo de imagen → pruebas de integración → publicar en GHCR.
# Gates de Trivy bloqueantes (issue #59): CRITICAL/HIGH con o sin parche cortan el pipeline.
# Publicar exige que pasen secretos, SAST, calidad, SCA, escaneo de imagen y pruebas,
# y publica la misma imagen que se escaneó (no se reconstruye).
# Próximas: deploy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 5.4 Detección de secretos: falla si encuentra credenciales en el repo o el historial
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # 5.3 SAST: análisis estático de seguridad del código (Go, TS, Python).
  # Reglas: p/default + OWASP top 10. Falla si encuentra hallazgos de severidad ERROR.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: gitleaks
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error app/src

  # 4.2 / 4.3 Calidad de código: SonarCloud con quality gate "Sonar way" (umbrales de bugs, smells, duplicación)
  quality:
    name: Calidad (SonarCloud)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 5.1 SCA: escanea dependencias (go.sum, yarn.lock, package-lock.json, requirements.txt).
  # Gate: bloquea cualquier CRITICAL/HIGH, tenga o no parche (ignore-unfixed: false).
  # 1) reporte JSON completo para evidencia; 2) gate con el código de salida real de Trivy.
  sca:
    name: Dependencias (Trivy fs)
    runs-on: ubuntu-latest
    needs: [gitleaks, sast]
    steps:
      - uses: actions/checkout@v4
      - name: Reporte SCA (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: app/src
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-sca.json
      - name: Gate SCA (falla con CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: app/src
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-sca.txt
      - name: Mostrar resultado del gate
        if: always() && hashFiles('trivy-sca.txt') != ''
        run: cat trivy-sca.txt
      - name: Guardar reportes SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca
          path: |
            trivy-sca.json
            trivy-sca.txt
          retention-days: 30
          if-no-files-found: warn

  # Build de las 6 imágenes en paralelo + 5.2 escaneo de cada imagen antes de publicar.
  # La imagen aprobada se guarda como artifact y es exactamente la que publica el job publish.
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gitleaks
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    env:
      IMAGE: ghcr.io/matheus-melo1994/tero-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app/src/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Registrar ID de la imagen construida
        run: docker image inspect --format '{{.Id}}' "$IMAGE" | tee image-id.txt
      - name: Reporte de imagen (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-image.json
      - name: Gate de imagen (falla con CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-image.txt
      - name: Mostrar resultado del gate
        if: always() && hashFiles('trivy-image.txt') != ''
        run: cat trivy-image.txt
      - name: Guardar reportes de imagen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: |
            image-id.txt
            trivy-image.json
            trivy-image.txt
          retention-days: 30
          if-no-files-found: warn
      # Solo se llega acá si el gate aprobó: se guarda la imagen escaneada para publicarla tal cual.
      - name: Exportar imagen aprobada
        run: docker save "$IMAGE" -o image.tar
      - name: Guardar imagen aprobada
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: tero-integration
      COMPOSE_FILE: app/docker-compose.yml:app/tests/integration/compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Preparar credenciales efímeras
        shell: bash
        run: |
          umask 077
          {
            echo 'POSTGRES_USER=retail_user'
            echo 'ADMIN_USERNAME=admin'
          } > "$RUNNER_TEMP/tero-ci.env"
          for key in POSTGRES_PASSWORD ADMIN_PASSWORD ADMIN_JWT_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$RUNNER_TEMP/tero-ci.env"
          done
      - name: Ejecutar las dos pruebas sobre Tero
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" up \
            --build --abort-on-container-exit --exit-code-from integration-tests \
            --attach integration-tests integration-tests
      - name: Recoger resultados y logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tero-test-results"
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" logs \
            --no-color --no-log-prefix integration-tests > "$RUNNER_TEMP/tero-test-results/integration.tap"
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" logs \
            --no-color --timestamps > "$RUNNER_TEMP/tero-test-results/compose.log"
          # Los valores generados son hexadecimales; también se ocultan en los archivos.
          while IFS='=' read -r key value; do
            case "$key" in
              *_PASSWORD|*_SECRET)
                sed -i "s/$value/[REDACTED]/g" "$RUNNER_TEMP/tero-test-results/"* ;;
            esac
          done < "$RUNNER_TEMP/tero-ci.env"
      - name: Guardar evidencia de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ${{ runner.temp }}/tero-test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Retirar el entorno temporal
        if: always()
        shell: bash
        run: |
          docker compose --env-file "$RUNNER_TEMP/tero-ci.env" down --volumes --remove-orphans
          rm -f "$RUNNER_TEMP/tero-ci.env"

  # 3.2 Publicar en registry: solo en push a main (no en PRs) y solo si pasaron todos los controles.
  # No reconstruye: carga la imagen escaneada en build, verifica su ID y la publica.
  # Las imágenes quedan en ghcr.io/matheus-melo1994/tero-<servicio>:<sha> y :latest
  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [gitleaks, sast, quality, sca, build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalog, orders, ui, admin, checkout, cart]
    env:
      IMAGE: ghcr.io/matheus-melo1994/tero-${{ matrix.service }}
    steps:
      - name: Descargar la imagen escaneada
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image
      - name: Descargar el ID registrado en el escaneo
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: scan
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar y publicar la misma imagen
        shell: bash
        run: |
          docker load -i image/image.tar
          loaded="$(docker image inspect --format '{{.Id}}' "$IMAGE:$GITHUB_SHA")"
          scanned="$(cat scan/image-id.txt)"
          echo "Escaneada: $scanned"
          echo "Cargada:   $loaded"
          test "$loaded" = "$scanned"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
